name: Generate pacman contribution graph

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:      # manual run from the Actions tab
  # NOTE: deliberately NO push trigger. The graph only changes when the
  # contribution calendar changes, which is at most once a day. Running it
  # on every push burned Actions minutes for an identical output.

permissions:
  contents: write

# If a scheduled run and a manual run overlap, keep the newest and cancel
# the older one — two jobs pushing to `output` at once would conflict.
concurrency:
  group: pacman-graph
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate arcade contribution graph SVGs
        # Pinned to a release tag rather than @main so an upstream change
        # can't silently alter this profile. To harden further, replace the
        # tag with its commit SHA:
        #   gh api repos/abozanona/pacman-contribution-graph/commits/v5.0.0 --jq .sha
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # Comma-separated. Other options: breakout, galaga,
          # puzzle-bobble, bomberman, minesweeper
          games: "pacman"

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
