name: Generate pacman contribution graph

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:      # manual run from the Actions tab
  # NOTE: deliberately NO push trigger. The graph only changes when the
  # contribution calendar changes — at most once a day. The old snake
  # workflow ran on every push and republished an identical SVG each time.

permissions:
  contents: write

# Shared with stats-mirror.yml. Both workflows commit generated assets to
# main, so they must not run at the same time — two runs that check out the
# same commit will both try to push and one will be rejected. cancel-in-progress
# is false so an overlapping run queues and then proceeds, rather than being
# thrown away.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate arcade contribution graph SVGs
        # Pinned to a release tag rather than @main so an upstream change
        # can't silently alter this profile. To harden further, replace the
        # tag with its commit SHA:
        #   gh api repos/abozanona/pacman-contribution-graph/commits/v5.0.0 --jq .sha
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # Comma-separated. Other options: breakout, galaga,
          # puzzle-bobble, bomberman, minesweeper
          games: "pacman"

      # The upstream README publishes these to a separate `output` branch via
      # crazy-max/ghaction-github-pages. We deliberately don't. That action
      # REPLACES the target branch wholesale, so any second workflow writing
      # to the same branch silently deletes the first one's files — which is
      # exactly what happened here when the snake and pacman workflows shared
      # the `output` branch on the same cron. Committing into assets/ on main
      # keeps every generated image in one place, matches how metrics.yml and
      # stats-mirror.yml already work, and drops a third-party action that
      # needed write access to the repo.
      - name: Copy graphs into assets/
        run: |
          set -euo pipefail
          test -d dist || { echo "::error::action produced no dist/ directory"; exit 1; }
          shopt -s nullglob
          found=(dist/pacman-contribution-graph*.svg)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::no pacman SVGs in dist/ — did the action's output filenames change?"
            ls -la dist || true
            exit 1
          fi
          mkdir -p assets/pacman
          cp dist/pacman-contribution-graph*.svg assets/pacman/
          ls -la assets/pacman

      - name: Commit refreshed graph
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pacman

          if git diff --staged --quiet; then
            echo "Graph unchanged today."
            exit 0
          fi

          git commit -m "chore(pacman): refresh contribution graph [skip ci]"

          # The concurrency group above should prevent overlap, but a push can
          # still be rejected if anything else lands on main while this job
          # runs. Rebase onto whatever arrived and retry instead of discarding
          # the generated graph — regenerating it costs several minutes.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main || {
              echo "::error::rebase failed; refusing to force-push"
              exit 1
            }
            sleep $((attempt * 3))
          done

          echo "::error::could not push after 5 attempts"
          exit 1
