name: Generate profile metrics

on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch:        # manual run from the Actions tab
  # NOTE: no push trigger on purpose — the action commits to main,
  # which would re-trigger itself in an endless loop.

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: etkaturan
          filename: assets/metrics.svg
          template: classic
          config_timezone: Europe/Berlin

          # base sections
          base: header, activity, community, repositories

          # top languages (replaces the broken top-langs widget)
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_colors: "#2E86C8, #C89217, #4EC994, #E5604C, #7E93A3, #E8EEF2"

          # contribution calendar (replaces the activity graph widget)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year