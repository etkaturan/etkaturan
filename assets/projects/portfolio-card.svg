<svg viewBox="0 0 460 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Portfolio website — etkaturan-portfolio.vercel.app">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="1" y="1" width="458" height="4" rx="2"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .base { font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .repo { font-size: 16px; font-weight: 600; fill: #a78bfa; }
    .desc { font-size: 13px; fill: #9fb1c1; }
    .stat { font-size: 12.5px; fill: #22d3ee; }
    .chip { font-size: 11.5px; fill: #8b949e; }
    .pill { font-size: 10.5px; fill: #2dd4a7; }
    .shine { animation: sweep 4s ease-in-out 2.4s infinite; }
    @keyframes sweep { 0% { transform: translateX(-140px); } 55%,100% { transform: translateX(460px); } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .shine, .dot { animation: none; } .shine { opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="459" height="229" rx="10" fill="#0b0e14" stroke="#1c2230"/>
  <rect x="1" y="1" width="458" height="4" rx="2" fill="url(#bar)"/>
  <g clip-path="url(#barclip)"><rect class="shine" x="0" y="1" width="140" height="4" fill="url(#shine)"/></g>

  <!-- header: globe icon -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <circle cx="37" cy="45" r="11"/>
    <ellipse cx="37" cy="45" rx="4.5" ry="11"/>
    <path d="M26.5 42 h21 M26.5 48 h21"/>
  </g>
  <text x="62" y="52" class="mono repo">etkaturan-portfolio.vercel.app</text>
  <rect x="376" y="36" width="56" height="20" rx="10" fill="none" stroke="#1c2230"/>
  <circle class="dot" cx="390" cy="46" r="3" fill="#2dd4a7"/>
  <text x="410" y="50" text-anchor="middle" class="mono pill">live</text>

  <!-- description -->
  <text x="28" y="90" class="base desc">Portfolio with six fully animated sections, custom cursor,</text>
  <text x="28" y="110" class="base desc">GitHub contributions graph, analytics and document vault.</text>

  <!-- highlight -->
  <text x="28" y="142" class="mono stat">▸ hand-built design system · custom event tracking · CV vault</text>

  <!-- chips -->
  <g class="mono chip">
    <rect x="24" y="166" width="80" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="64" y="182" text-anchor="middle">React 18</text>
    <rect x="114" y="166" width="51" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="139" y="182" text-anchor="middle">Vite</text>
    <rect x="175" y="166" width="101" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="225" y="182" text-anchor="middle">Tailwind v4</text>
    <rect x="286" y="166" width="116" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="344" y="182" text-anchor="middle">Framer Motion</text>
  </g>
</svg>
