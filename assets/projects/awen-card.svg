<svg viewBox="0 0 460 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Awen — AI-powered German language learning platform">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="1" y="1" width="458" height="4" rx="2"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .base { font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .repo { font-size: 17px; font-weight: 600; fill: #22d3ee; }
    .desc { font-size: 13px; fill: #9fb1c1; }
    .stat { font-size: 12.5px; fill: #a78bfa; }
    .chip { font-size: 11.5px; fill: #8b949e; }
    .pill { font-size: 10.5px; fill: #8b949e; }
    .shine { animation: sweep 4s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-140px); } 55%,100% { transform: translateX(460px); } }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="459" height="229" rx="10" fill="#0b0e14" stroke="#1c2230"/>
  <rect x="1" y="1" width="458" height="4" rx="2" fill="url(#bar)"/>
  <g clip-path="url(#barclip)"><rect class="shine" x="0" y="1" width="140" height="4" fill="url(#shine)"/></g>

  <!-- header -->
  <path d="M28 40 v14 M28 47 h10 a5 5 0 0 0 5 -5 v-2 M28 43 a3 3 0 1 0 0.01 0 M43 37 a3 3 0 1 0 0.01 0 M28 54 a3 3 0 1 0 0.01 0" stroke="#8b949e" stroke-width="1.6" fill="none"/>
  <text x="62" y="52" class="mono repo">etkaturan / Awen</text>
  <rect x="366" y="36" width="66" height="20" rx="10" fill="none" stroke="#1c2230"/>
  <text x="399" y="50" text-anchor="middle" class="mono pill">v1.2</text>

  <!-- description -->
  <text x="28" y="90" class="base desc">AI-powered German learning platform — 5 exercise modes,</text>
  <text x="28" y="110" class="base desc">LLM speaking partner, listening comprehension, dual TTS.</text>

  <!-- highlight -->
  <text x="28" y="142" class="mono stat">▸ 10 production releases · LLM evaluation &lt; 2s · CEFR-tuned prompts</text>

  <!-- chips -->
  <g class="mono chip">
    <rect x="24" y="166" width="58" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="53" y="182" text-anchor="middle">React</text>
    <rect x="92" y="166" width="94" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="139" y="182" text-anchor="middle">TypeScript</text>
    <rect x="196" y="166" width="73" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="232" y="182" text-anchor="middle">FastAPI</text>
    <rect x="279" y="166" width="58" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="308" y="182" text-anchor="middle">Tauri</text>
    <rect x="347" y="166" width="73" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="383" y="182" text-anchor="middle">LLaMA 3</text>
  </g>
</svg>
