<svg viewBox="0 0 460 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Spatial Hypertext — human-AI collaborative knowledge tool">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="1" y="1" width="458" height="4" rx="2"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .base { font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .repo { font-size: 16px; font-weight: 600; fill: #22d3ee; }
    .desc { font-size: 13px; fill: #9fb1c1; }
    .stat { font-size: 12.5px; fill: #a78bfa; }
    .chip { font-size: 11.5px; fill: #8b949e; }
    .pill { font-size: 10.5px; fill: #8b949e; }
    .shine { animation: sweep 4s ease-in-out 1.6s infinite; }
    @keyframes sweep { 0% { transform: translateX(-140px); } 55%,100% { transform: translateX(460px); } }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="459" height="229" rx="10" fill="#0b0e14" stroke="#1c2230"/>
  <rect x="1" y="1" width="458" height="4" rx="2" fill="url(#bar)"/>
  <g clip-path="url(#barclip)"><rect class="shine" x="0" y="1" width="140" height="4" fill="url(#shine)"/></g>

  <!-- header -->
  <path d="M28 40 v14 M28 47 h10 a5 5 0 0 0 5 -5 v-2 M28 43 a3 3 0 1 0 0.01 0 M43 37 a3 3 0 1 0 0.01 0 M28 54 a3 3 0 1 0 0.01 0" stroke="#8b949e" stroke-width="1.6" fill="none"/>
  <text x="62" y="52" class="mono repo" font-size="14">ai-supported-spatial-hypertext</text>
  <rect x="352" y="36" width="80" height="20" rx="10" fill="none" stroke="#1c2230"/>
  <text x="392" y="50" text-anchor="middle" class="mono pill">research</text>

  <!-- description -->
  <text x="28" y="90" class="base desc">Human-AI knowledge tool: NER + relation extraction builds a</text>
  <text x="28" y="110" class="base desc">Neo4j graph from raw text; LangChain chat — no Cypher needed.</text>

  <!-- highlight -->
  <text x="28" y="142" class="mono stat">▸ adopted by Hof University's Visual Analytics lab · B.Sc. thesis</text>

  <!-- chips -->
  <g class="mono chip">
    <rect x="24" y="166" width="58" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="53" y="182" text-anchor="middle">Flask</text>
    <rect x="92" y="166" width="58" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="121" y="182" text-anchor="middle">Neo4j</text>
    <rect x="160" y="166" width="87" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="203" y="182" text-anchor="middle">LangChain</text>
    <rect x="257" y="166" width="44" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="279" y="182" text-anchor="middle">NLP</text>
    <rect x="311" y="166" width="66" height="24" rx="12" fill="#0d1220" stroke="#1c2230"/><text x="344" y="182" text-anchor="middle">Docker</text>
  </g>
</svg>
