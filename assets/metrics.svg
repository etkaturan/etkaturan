<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile metrics are being generated by a scheduled workflow">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .ttl  { font-size: 20px; font-weight: 600; fill: #22d3ee; }
    .sub  { font-size: 14px; fill: #9fb1c1; }
    .dim  { font-size: 12px; fill: #565e6b; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>

  <rect x="1" y="1" width="998" height="298" rx="14" fill="#070707" stroke="#1f2630" stroke-width="2"/>

  <circle cx="60" cy="150" r="7" fill="#22d3ee" class="pulse"/>

  <text x="92" y="140" class="mono ttl">Metrics pending first run</text>
  <text x="92" y="168" class="mono sub">This card is regenerated daily by .github/workflows/metrics.yml</text>
  <text x="92" y="196" class="mono dim">Actions tab → "Generate profile metrics" → Run workflow</text>
</svg>
