<svg viewBox="0 0 1000 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open to full-time roles and freelance projects">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <style>
    .base { font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .head { font-size: 22px; font-weight: 700; fill: #e6edf3; }
    .sub { font-size: 13.5px; fill: #8b949e; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="999" height="109" rx="12" fill="#0b0e14" stroke="#1c2230"/>

  <circle class="dot" cx="330" cy="42" r="5" fill="#2dd4a7"/>
  <text x="348" y="49" class="base head">Let's build something together</text>
  <text x="500" y="80" text-anchor="middle" class="mono sub">open to full-time roles · freelance projects · collaboration — response within 24h</text>

  <rect x="460" y="97" width="80" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
