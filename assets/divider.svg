<svg viewBox="0 0 1000 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .runner { animation: run 5s linear infinite; }
    @keyframes run { from { transform: translateX(-160px); } to { transform: translateX(1000px); } }
    @media (prefers-reduced-motion: reduce) { .runner { animation: none; opacity: 0; } }
  </style>
  <line x1="0" y1="12" x2="1000" y2="12" stroke="#1c2230" stroke-width="1"/>
  <rect class="runner" x="0" y="11" width="160" height="2" rx="1" fill="url(#pulse)"/>
</svg>
