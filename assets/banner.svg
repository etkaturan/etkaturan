<svg viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mekhmetetka Turan — Full-Stack Developer and AI Engineer">
  <defs>
    <radialGradient id="glow" cx="78%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070707" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <style>
    .base { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .eyebrow { font-size: 13px; letter-spacing: 4px; font-weight: 600; fill: #22d3ee; }
    .name { font-size: 46px; font-weight: 700; fill: #e6edf3; letter-spacing: -0.5px; }
    .type { font-size: 16px; fill: #9fb1c1; }
    .meta { font-size: 13px; fill: #8b949e; }
    .label { font-size: 11px; fill: #8b949e; }

    .tw { opacity: 0; }
    #p1 { animation: w1 16s steps(38, end) infinite; }
    #p2 { animation: w2 16s steps(34, end) infinite; }
    #p3 { animation: w3 16s steps(40, end) infinite; }
    @keyframes w1 { 0%,1% {opacity:1; clip-path: inset(0 100% 0 0);} 14% {opacity:1; clip-path: inset(0 0% 0 0);} 30% {opacity:1; clip-path: inset(0 0% 0 0);} 31%,100% {opacity:0; clip-path: inset(0 100% 0 0);} }
    @keyframes w2 { 0%,33% {opacity:0; clip-path: inset(0 100% 0 0);} 34% {opacity:1; clip-path: inset(0 100% 0 0);} 47% {opacity:1; clip-path: inset(0 0% 0 0);} 63% {opacity:1; clip-path: inset(0 0% 0 0);} 64%,100% {opacity:0; clip-path: inset(0 100% 0 0);} }
    @keyframes w3 { 0%,66% {opacity:0; clip-path: inset(0 100% 0 0);} 67% {opacity:1; clip-path: inset(0 100% 0 0);} 80% {opacity:1; clip-path: inset(0 0% 0 0);} 97% {opacity:1; clip-path: inset(0 0% 0 0);} 98%,100% {opacity:0; clip-path: inset(0 100% 0 0);} }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }

    .edge { stroke: #1c2230; stroke-width: 1.2; }
    .edge-draw { stroke: url(#accent); stroke-width: 1.2; stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 6s ease-in-out infinite; opacity: 0.55; }
    @keyframes draw { 0% {stroke-dashoffset:160;} 45% {stroke-dashoffset:0;} 75% {stroke-dashoffset:0; opacity:0.55;} 100% {stroke-dashoffset:0; opacity:0;} }
    .d2 { animation-delay: 1.2s; }
    .d3 { animation-delay: 2.4s; }
    .d4 { animation-delay: 3.4s; }

    @media (prefers-reduced-motion: reduce) {
      #p1, #p2, #p3 { animation: none; opacity: 0; clip-path: none; }
      #p1 { opacity: 1; }
      .edge-draw, .cursor { animation: none; }
    }
  </style>

  <!-- background -->
  <rect width="1000" height="340" rx="12" fill="#070707"/>
  <rect width="1000" height="340" rx="12" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="339" rx="12" stroke="#1c2230"/>

  <!-- ======= LEFT: identity ======= -->
  <text x="64" y="96" class="base eyebrow">FULL-STACK DEVELOPER &amp; AI ENGINEER</text>
  <text x="64" y="148" class="base name">Mekhmetetka Turan</text>
  <rect x="64" y="164" width="72" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- typewriter -->
  <g class="mono type">
    <text id="p1" class="tw" x="64" y="214">$ building AI-powered web &amp; desktop apps</text>
    <text id="p2" class="tw" x="64" y="214">$ React · TypeScript · Python · FastAPI</text>
    <text id="p3" class="tw" x="64" y="214">$ shipping Awen — 10 releases and counting</text>
    <rect class="cursor" x="52" y="202" width="7" height="15" fill="#22d3ee"/>
  </g>

  <!-- meta line -->
  <g class="base meta">
    <circle cx="69" cy="266" r="4" fill="#2dd4a7">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="271">Open to work · Fürth, Germany · EU Blue Card eligible</text>
  </g>

  <!-- ======= RIGHT: knowledge graph (NER → Neo4j → LLM, the pipeline I build) ======= -->
  <g>
    <!-- static edges -->
    <path class="edge" d="M700 84 L818 62"/>
    <path class="edge" d="M818 62 L898 132"/>
    <path class="edge" d="M700 84 L762 172"/>
    <path class="edge" d="M762 172 L652 224"/>
    <path class="edge" d="M762 172 L862 242"/>
    <path class="edge" d="M898 132 L862 242"/>
    <path class="edge" d="M652 224 L702 290"/>
    <path class="edge" d="M862 242 L930 288"/>

    <!-- animated redraw edges -->
    <path class="edge-draw" d="M700 84 L762 172"/>
    <path class="edge-draw d2" d="M818 62 L898 132"/>
    <path class="edge-draw d3" d="M762 172 L862 242"/>
    <path class="edge-draw d4" d="M652 224 L702 290"/>

    <!-- data packets travelling the graph -->
    <circle r="2.5" fill="#22d3ee">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M700 84 L762 172 L862 242"/>
    </circle>
    <circle r="2.5" fill="#a78bfa">
      <animateMotion dur="5.5s" begin="1.5s" repeatCount="indefinite" path="M818 62 L898 132 L862 242 L930 288"/>
    </circle>
    <circle r="2" fill="#22d3ee">
      <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M762 172 L652 224 L702 290"/>
    </circle>

    <!-- nodes: halo + core + label -->
    <g>
      <circle cx="700" cy="84" r="6" fill="none" stroke="#22d3ee" stroke-opacity="0.5">
        <animate attributeName="r" values="6;16" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="84" r="6" fill="#0b0e14" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="700" y="66" text-anchor="middle" class="mono label">LLM</text>
    </g>
    <g>
      <circle cx="818" cy="62" r="6" fill="none" stroke="#a78bfa" stroke-opacity="0.5">
        <animate attributeName="r" values="6;16" dur="3s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0" dur="3s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="818" cy="62" r="6" fill="#0b0e14" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="836" y="52" class="mono label">React</text>
    </g>
    <g>
      <circle cx="898" cy="132" r="6" fill="#0b0e14" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="914" y="128" class="mono label">TS</text>
    </g>
    <g>
      <circle cx="762" cy="172" r="7" fill="none" stroke="#22d3ee" stroke-opacity="0.5">
        <animate attributeName="r" values="7;18" dur="3s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="762" cy="172" r="7" fill="#0b0e14" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="782" y="178" class="mono label">FastAPI</text>
    </g>
    <g>
      <circle cx="652" cy="224" r="6" fill="none" stroke="#a78bfa" stroke-opacity="0.5">
        <animate attributeName="r" values="6;15" dur="3s" begin="2.1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0" dur="3s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="652" cy="224" r="6" fill="#0b0e14" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="634" y="212" text-anchor="end" class="mono label">Neo4j</text>
    </g>
    <g>
      <circle cx="862" cy="242" r="6" fill="#0b0e14" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="880" y="248" class="mono label">Python</text>
    </g>
    <g>
      <circle cx="702" cy="290" r="5" fill="#0b0e14" stroke="#8b949e" stroke-width="1.2"/>
      <text x="686" y="304" text-anchor="end" class="mono label">Docker</text>
    </g>
    <circle cx="930" cy="288" r="4" fill="#0b0e14" stroke="#1c2230" stroke-width="1.2"/>
  </g>
</svg>
